<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andreani Control Diario</title>

    <!-- Icono -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Estilo -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: white;
            padding: 15px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        header img {
            width: 180px;
        }

        .container {
            margin-top: 20px;
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #e30613;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c00510;
        }

        .list {
            margin-top: 20px;
        }

        .item {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <header>
        <img src="logo.png" alt="Andreani Control Diario">
    </header>

    <div class="container">
        <h1>Control Diario</h1>

        <input type="text" id="inputDato" placeholder="Ingresar dato...">
        <button onclick="agregarDato()">Agregar</button>

        <div class="list" id="lista"></div>
    </div>

    <script>
        function agregarDato() {
            const input = document.getElementById("inputDato");
            const lista = document.getElementById("lista");

            if (input.value.trim() === "") return;

            const item = document.createElement("div");
            item.className = "item";
            item.textContent = input.value;

            lista.appendChild(item);

            input.value = "";
        }
    </script>

</body>
</html>
