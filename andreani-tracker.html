<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andreani Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: #000; font-family: system-ui, sans-serif; padding-bottom: 60px; }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 2px solid #ccc; background: #fff; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-title { font-size: 18px; font-weight: 900; letter-spacing: 2px; color: #000; }
  .logo-sub { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #444; }
  .btn-cargar { background: #cc0000; color: #fff; border: none; border-radius: 10px; padding: 12px 20px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; }

  /* TABS */
  .tabs { display: flex; border-bottom: 2px solid #ccc; padding: 0 20px; background: #fff; }
  .tab { background: none; border: none; color: #444; font-family: inherit; font-size: 15px; font-weight: 800; padding: 14px 18px 12px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #cc0000; border-bottom: 3px solid #cc0000; }

  /* FILTROS */
  .filtros { display: flex; gap: 12px; padding: 16px 20px; flex-wrap: wrap; align-items: flex-end; background: #f8f8f8; border-bottom: 1px solid #ccc; }
  .filtro-group { display: flex; flex-direction: column; gap: 6px; }
  .filtro-label { font-size: 11px; font-weight: 800; color: #000; letter-spacing: 2px; text-transform: uppercase; }
  .filtro-row { display: flex; gap: 8px; }
  select { background: #fff; border: 1px solid #ccc; color: #000; border-radius: 8px; padding: 10px 12px; font-family: inherit; font-size: 14px; font-weight: 700; }

  /* PERIODO TAG */
  .periodo-tag { background: rgba(204,0,0,0.08); border: 2px solid #cc0000; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 800; color: #cc0000; margin: 16px 20px; }

  /* CATEGORIAS GRID */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; }
  .cat-card { background: #f2f2f2; border: 1px solid #ccc; border-radius: 10px; padding: 14px 16px; }
  .cat-name { font-size: 12px; font-weight: 700; color: #222; margin-bottom: 10px; line-height: 1.4; }
  .cat-stats { display: flex; justify-content: space-between; align-items: flex-end; }
  .cat-cant { font-size: 24px; font-weight: 900; color: #000; }
  .cat-unit { font-size: 12px; font-weight: 700; color: #666; }
  .cat-monto { font-size: 13px; font-weight: 800; color: #cc0000; }

  /* TOTAL CARD */
  .total-card { margin: 16px 20px 0; background: #fff; border: 3px solid #cc0000; border-radius: 14px; padding: 20px; }
  .total-row { display: flex; justify-content: space-between; align-items: center; }
  .total-label { font-size: 12px; font-weight: 800; color: #000; letter-spacing: 2px; text-transform: uppercase; }
  .total-num { font-size: 36px; font-weight: 900; color: #000; }
  .total-monto { font-size: 36px; font-weight: 900; color: #cc0000; }
  .divider { height: 2px; background: #ccc; margin: 14px 0; }

  /* HISTORIAL */
  .hist-wrap { padding: 16px 20px; }
  .hist-row { display: flex; align-items: center; background: #fff; border: 1px solid #ccc; border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; }
  .hist-fecha { font-size: 15px; font-weight: 800; color: #000; min-width: 110px; }
  .hist-stats { flex: 1; text-align: right; }
  .hist-envios { font-size: 12px; font-weight: 700; color: #666; display: block; }
  .hist-monto { font-size: 16px; font-weight: 900; color: #cc0000; display: block; }
  .btn-del { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px; margin-left: 12px; }

  /* EMPTY */
  .empty { text-align: center; color: #666; padding: 60px 20px; font-size: 15px; font-weight: 700; line-height: 2; }

  /* OVERLAY */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; z-index: 200; }
  .modal { background: #fff; border: 1px solid #ccc; border-radius: 20px 20px 0 0; width: 100%; max-height: 92vh; display: flex; flex-direction: column; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 2px solid #ccc; flex-shrink: 0; }
  .modal-title { font-size: 18px; font-weight: 900; color: #000; }
  .modal-sub { font-size: 12px; font-weight: 700; color: #444; margin-top: 2px; }
  .btn-close { background: #f2f2f2; border: none; color: #222; font-size: 20px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  .modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

  /* FILE ZONE */
  .file-zone { background: #f2f2f2; border: 1px solid #ccc; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .file-zone-header { display: flex; align-items: center; gap: 8px; }
  .file-zone-title { font-size: 14px; font-weight: 800; color: #000; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 2px 8px; border-radius: 4px; }
  .badge-req { background: rgba(204,0,0,0.1); color: #cc0000; }
  .badge-opt { background: #e0e0e0; color: #666; }
  .file-zone-hint { font-size: 12px; font-weight: 600; color: #555; }
  .file-btn-wrap { position: relative; width: 100%; height: 54px; }
  .file-btn-visual { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; border: 1px dashed #ccc; border-radius: 10px; font-size: 14px; font-weight: 700; color: #222; pointer-events: none; }
  .file-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .file-ok { font-size: 12px; font-weight: 700; color: #006600; background: rgba(0,102,0,0.08); border: 1px solid rgba(0,102,0,0.25); border-radius: 6px; padding: 6px 10px; }

  /* BOTONES */
  .big-btn { width: 100%; padding: 16px; font-weight: 800; font-size: 16px; cursor: pointer; font-family: inherit; border-radius: 12px; border: none; }
  .big-btn-red { background: #cc0000; color: #fff; }
  .big-btn-outline { background: none; border: 1px solid #ccc; color: #222; }

  /* STEP 2 LOADING */
  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 20px; }
  .spinner { width: 56px; height: 56px; border: 5px solid #ccc; border-top: 5px solid #cc0000; border-radius: 50%; animation: spin 0.8s linear infinite; }
  .loading-msg { font-size: 16px; font-weight: 800; color: #000; text-align: center; }
  .loading-sub { font-size: 13px; font-weight: 700; color: #666; text-align: center; }

  /* STEP 3 REVIEW */
  .stats-row { display: flex; justify-content: space-around; background: #f2f2f2; border-radius: 12px; padding: 18px 10px; }
  .stat-item { text-align: center; }
  .stat-num { font-size: 32px; font-weight: 900; }
  .stat-label { font-size: 11px; font-weight: 700; color: #666; margin-top: 4px; }
  .review-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
  .review-cat { flex: 1; font-size: 13px; font-weight: 700; color: #222; }
  .review-cant { font-size: 16px; font-weight: 900; color: #000; min-width: 36px; text-align: right; }
  .review-monto { font-size: 14px; font-weight: 800; color: #cc0000; min-width: 110px; text-align: right; }
  .review-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 900; padding: 10px 0; }
  .warning-box { background: rgba(204,0,0,0.08); border: 1px solid rgba(204,0,0,0.35); border-radius: 10px; padding: 12px 14px; }
  .warning-title { font-size: 14px; font-weight: 800; color: #cc0000; }
  .warning-sub { font-size: 12px; font-weight: 700; color: #666; margin-top: 4px; }

  /* STEP 4 MANUAL */
  .manual-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
  .manual-cat { flex: 1; font-size: 13px; font-weight: 700; color: #222; }
  .manual-input { background: #f2f2f2; border: 1px solid #ccc; color: #cc0000; border-radius: 8px; padding: 8px 12px; font-family: inherit; font-size: 16px; font-weight: 900; width: 80px; text-align: right; }

  /* INPUT fecha */
  .date-input { background: #fff; border: 1px solid #ccc; color: #000; border-radius: 8px; padding: 12px 14px; font-family: inherit; font-size: 15px; font-weight: 700; width: 100%; }

  .error-box { background: rgba(204,0,0,0.08); border: 1px solid #cc0000; border-radius: 8px; padding: 12px 14px; color: #cc0000; font-size: 14px; font-weight: 700; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .anim-up { animation: up 0.3s ease; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <svg width="46" height="46" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="14" fill="#cc0000"/>
      <polygon points="10,88 38,18 50,18 28,88" fill="white"/>
      <polygon points="90,88 62,18 50,18 72,88" fill="white"/>
      <polygon points="38,54 50,22 62,54" fill="#cc0000"/>
      <rect x="30" y="54" width="40" height="9" fill="white"/>
    </svg>
    <div>
      <div class="logo-title">ANDREANI</div>
      <div class="logo-sub">TRACKER DE ENVÍOS</div>
    </div>
  </div>
  <button class="btn-cargar" onclick="openModal()">+ Cargar día</button>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" id="tab-resumen" onclick="switchTab('resumen')">Resumen</button>
  <button class="tab" id="tab-historial" onclick="switchTab('historial')">Historial</button>
</div>

<!-- FILTROS -->
<div class="filtros">
  <div class="filtro-group">
    <span class="filtro-label">Período</span>
    <div class="filtro-row">
      <select id="sel-mes" onchange="render()"></select>
      <select id="sel-anio" onchange="render()"></select>
    </div>
  </div>
  <div class="filtro-group">
    <span class="filtro-label">Día</span>
    <select id="sel-dia" onchange="render()"><option value="todos">Todo el mes</option></select>
  </div>
</div>

<!-- CONTENIDO -->
<div id="content-resumen" class="anim-up"></div>
<div id="content-historial" class="hidden anim-up"></div>

<!-- MODAL -->
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">Cargar archivos</div>
        <div class="modal-sub" id="modal-sub">Hoja de ruta + Excel + No entregados</div>
      </div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const STORAGE_KEY = "andreani-tracker-standalone-v1";
const PRECIOS = {
  "Encomienda eCommerce": 2183, "Documento Andreani": 1707, "Tarjeta Financiera": 1613,
  "Tarjeta Financiera Paquete": 1613, "Tarjeta Financiera Prepagas": 1613,
  "Planilla conformada": 1519, "Encomienda corporativa": 2356, "Encomienda Natura": 2084,
  "Alta TD": 1613, "Telefonía": 2183, "Reposición TD": 1613,
  "Encomienda eCommerce Internacional": 1800, "LI Retiro": 2183, "Constancia de entrega": 2183,
};
const EQUIV = { "LI Retiro": "Encomienda eCommerce", "Constancia de entrega": "Encomienda eCommerce", "Tarjeta Financiera Prepagas": "Tarjeta Financiera" };
const normCat = c => EQUIV[c] || c;
const getPrice = c => PRECIOS[normCat(c)] || PRECIOS[c] || 0;
const fmt = n => "$" + Math.round(n).toLocaleString("es-AR");
const today = new Date();

let data = {};
let currentTab = "resumen";
let step = 1;
let hojaFiles = [], excelFile = null, noEntFiles = [], reviewData = null;

// STORAGE
function loadData() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) data = JSON.parse(s); } catch {}
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

// INIT selects
function initSelects() {
  const sm = document.getElementById("sel-mes");
  MESES.forEach((m, i) => { const o = document.createElement("option"); o.value = i; o.textContent = m; if (i === today.getMonth()) o.selected = true; sm.appendChild(o); });
  const sa = document.getElementById("sel-anio");
  [2024,2025,2026,2027].forEach(y => { const o = document.createElement("option"); o.value = y; o.textContent = y; if (y === today.getFullYear()) o.selected = true; sa.appendChild(o); });
}

function getMesIdx() { return parseInt(document.getElementById("sel-mes").value); }
function getAnio() { return parseInt(document.getElementById("sel-anio").value); }
function getDia() { return document.getElementById("sel-dia").value; }

function getDiasMes() {
  return Object.keys(data).filter(d => { const dt = new Date(d+"T00:00:00"); return dt.getMonth()===getMesIdx() && dt.getFullYear()===getAnio(); }).sort();
}

function updateDiaSelect() {
  const sel = document.getElementById("sel-dia");
  const cur = sel.value;
  sel.innerHTML = '<option value="todos">Todo el mes</option>';
  getDiasMes().forEach(d => {
    const dt = new Date(d+"T00:00:00");
    const o = document.createElement("option");
    o.value = d; o.textContent = dt.getDate()+" de "+MESES[dt.getMonth()];
    if (d === cur) o.selected = true;
    sel.appendChild(o);
  });
}

function getResumen() {
  const dias = getDia()==="todos" ? getDiasMes() : [getDia()];
  const tot = {};
  dias.forEach(d => Object.entries(data[d]||{}).forEach(([c,n]) => { tot[c]=(tot[c]||0)+n; }));
  return tot;
}

function switchTab(t) {
  currentTab = t;
  document.getElementById("tab-resumen").classList.toggle("active", t==="resumen");
  document.getElementById("tab-historial").classList.toggle("active", t==="historial");
  document.getElementById("content-resumen").classList.toggle("hidden", t!=="resumen");
  document.getElementById("content-historial").classList.toggle("hidden", t!=="historial");
  render();
}

function render() {
  updateDiaSelect();
  if (currentTab==="resumen") renderResumen();
  else renderHistorial();
}

function renderResumen() {
  const el = document.getElementById("content-resumen");
  const res = getResumen();
  const totalEnv = Object.values(res).reduce((a,b)=>a+b,0);
  const totalMonto = Object.entries(res).reduce((a,[c,n])=>a+n*getPrice(c),0);
  const dia = getDia();
  const periodoTxt = dia==="todos"
    ? MESES[getMesIdx()]+" "+getAnio()+" — mes completo"
    : (()=>{ const dt=new Date(dia+"T00:00:00"); return dt.getDate()+" de "+MESES[dt.getMonth()]+" "+getAnio(); })();

  if (totalEnv===0) {
    el.innerHTML = `<div class="periodo-tag">${periodoTxt}</div><div class="empty">Sin datos para este período.<br>Tocá "+ Cargar día" para comenzar.</div>`;
    return;
  }

  let cats = Object.entries(res).sort((a,b)=>b[1]-a[1]).map(([cat,cant])=>`
    <div class="cat-card">
      <div class="cat-name">${cat}</div>
      <div class="cat-stats">
        <div class="cat-cant">${cant}<span class="cat-unit"> env.</span></div>
        <div class="cat-monto">${fmt(cant*getPrice(cat))}</div>
      </div>
    </div>`).join("");

  el.innerHTML = `
    <div class="periodo-tag">${periodoTxt}</div>
    <div class="cat-grid">${cats}</div>
    <div class="total-card">
      <div class="total-row"><span class="total-label">Total envíos</span><span class="total-num">${totalEnv}</span></div>
      <div class="divider"></div>
      <div class="total-row"><span class="total-label">Monto total</span><span class="total-monto">${fmt(totalMonto)}</span></div>
    </div>`;
}

function renderHistorial() {
  const el = document.getElementById("content-historial");
  const dias = getDiasMes();
  if (dias.length===0) { el.innerHTML=`<div class="hist-wrap"><div class="empty">Sin datos para ${MESES[getMesIdx()]} ${getAnio()}.</div></div>`; return; }
  let rows = dias.map(d => {
    const dt = new Date(d+"T00:00:00");
    const env = Object.values(data[d]||{}).reduce((a,b)=>a+b,0);
    const mon = Object.entries(data[d]||{}).reduce((a,[c,n])=>a+n*getPrice(c),0);
    return `<div class="hist-row">
      <div class="hist-fecha">${dt.getDate()} ${MESES[dt.getMonth()]}</div>
      <div class="hist-stats"><span class="hist-envios">${env} envíos</span><span class="hist-monto">${fmt(mon)}</span></div>
      <button class="btn-del" onclick="delDay('${d}')">🗑️</button>
    </div>`;
  }).join("");
  el.innerHTML = `<div class="hist-wrap">${rows}</div>`;
}

function delDay(d) {
  delete data[d]; saveData(); render();
}

// MODAL
function openModal() {
  step = 1; hojaFiles=[]; excelFile=null; noEntFiles=[]; reviewData=null;
  document.getElementById("overlay").classList.remove("hidden");
  renderStep();
}
function closeModal() {
  document.getElementById("overlay").classList.add("hidden");
}

function todayStr() { return today.toISOString().split("T")[0]; }

function renderStep() {
  const title = document.getElementById("modal-title");
  const sub = document.getElementById("modal-sub");
  const body = document.getElementById("modal-body");
  const closeBtn = document.querySelector(".btn-close");

  if (step===1) {
    title.textContent = "Cargar archivos";
    sub.textContent = "Hoja de ruta + Excel + No entregados";
    closeBtn.style.display = "flex";
    body.innerHTML = `
      <div class="filtro-group">
        <span class="filtro-label">Fecha del día</span>
        <input type="date" class="date-input" id="inp-fecha" value="${todayStr()}">
      </div>
      ${fileZoneHTML("📄 Hoja de ruta", "PDF o fotos — podés seleccionar múltiples", true, true, "image/*,application/pdf", "hoja")}
      ${fileZoneHTML("📊 Excel de gestión", "Archivo .xlsx con columnas Envío y Tipo de Servicio", true, false, ".xlsx,.xls", "excel")}
      ${fileZoneHTML("❌ No entregados", "Foto o captura — opcional", false, true, "image/*,application/pdf", "noent")}
      <div class="error-box hidden" id="error-box"></div>
      <button class="big-btn big-btn-red" onclick="processFiles()">⚡ Procesar archivos</button>
      <button class="big-btn big-btn-outline" onclick="goManual()">✏️ Carga manual</button>
    `;
    // Restore file names if already selected
    updateFileLabels();
  } else if (step===2) {
    title.textContent = "Procesando...";
    sub.textContent = "";
    closeBtn.style.display = "none";
    body.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-msg" id="proc-msg">Iniciando...</div><div class="loading-sub">Esto puede tomar unos segundos...</div></div>`;
  } else if (step===3 && reviewData) {
    title.textContent = "Revisar resultado";
    sub.textContent = "";
    closeBtn.style.display = "flex";
    const cats = Object.entries(reviewData.cats).sort((a,b)=>b[1]-a[1]);
    const total = cats.reduce((a,[c,n])=>a+n*getPrice(c),0);
    const catsHTML = cats.map(([cat,cant])=>`
      <div class="review-row">
        <span class="review-cat">${cat}</span>
        <span class="review-cant">${cant}</span>
        <span class="review-monto">${fmt(cant*getPrice(cat))}</span>
      </div>`).join("");
    const warnHTML = reviewData.sinMatch.length>0 ? `<div class="warning-box"><div class="warning-title">⚠️ ${reviewData.sinMatch.length} sin categoría detectada</div><div class="warning-sub">Se excluyen del total.</div></div>` : "";
    body.innerHTML = `
      <div class="stats-row">
        <div class="stat-item"><div class="stat-num" style="color:#000">${reviewData.todosCount}</div><div class="stat-label">hoja de ruta</div></div>
        <div class="stat-item"><div class="stat-num" style="color:#cc0000">${reviewData.noEntCount}</div><div class="stat-label">no entregados</div></div>
        <div class="stat-item"><div class="stat-num" style="color:#006600">${reviewData.entCount}</div><div class="stat-label">facturables</div></div>
      </div>
      <div class="divider"></div>
      ${catsHTML}
      <div class="review-total"><span style="color:#000">TOTAL</span><span style="color:#cc0000">${fmt(total)}</span></div>
      ${warnHTML}
      <button class="big-btn big-btn-red" onclick="confirmSave()">💾 Guardar</button>
      <button class="big-btn big-btn-outline" onclick="goBack()">← Volver</button>`;
  } else if (step===4) {
    title.textContent = "Carga manual";
    sub.textContent = "";
    closeBtn.style.display = "flex";
    const rows = Object.keys(PRECIOS).map(cat=>`
      <div class="manual-row">
        <span class="manual-cat">${cat}</span>
        <input type="number" min="0" class="manual-input" id="m_${cat.replace(/\s/g,'_')}" placeholder="0">
      </div>`).join("");
    body.innerHTML = `
      <div class="filtro-group">
        <span class="filtro-label">Fecha</span>
        <input type="date" class="date-input" id="inp-fecha-m" value="${todayStr()}">
      </div>
      <span class="filtro-label">Cantidades por categoría</span>
      ${rows}
      <button class="big-btn big-btn-red" onclick="manualSave()" style="margin-top:8px">💾 Guardar</button>
      <button class="big-btn big-btn-outline" onclick="goBack()">← Volver</button>`;
  }
}

function fileZoneHTML(label, hint, required, multiple, accept, id) {
  const badge = required ? '<span class="badge badge-req">REQUERIDO</span>' : '<span class="badge badge-opt">OPCIONAL</span>';
  return `<div class="file-zone">
    <div class="file-zone-header"><span class="file-zone-title">${label}</span>${badge}</div>
    <div class="file-zone-hint">${hint}</div>
    <div class="file-btn-wrap">
      <div class="file-btn-visual">📁 Seleccionar ${multiple?"archivos":"archivo"}</div>
      <input type="file" class="file-input" ${multiple?"multiple":""} accept="${accept}" onchange="handleFile(event,'${id}')">
    </div>
    <div id="files-${id}"></div>
  </div>`;
}

function handleFile(e, id) {
  const files = Array.from(e.target.files);
  if (id==="hoja") hojaFiles = files;
  else if (id==="excel") excelFile = files[0]||null;
  else if (id==="noent") noEntFiles = files;
  updateFileLabels();
}

function updateFileLabels() {
  const show = (id, files) => {
    const el = document.getElementById("files-"+id);
    if (!el) return;
    el.innerHTML = files.map(f=>`<div class="file-ok">✓ ${f.name}</div>`).join("");
  };
  show("hoja", hojaFiles);
  show("excel", excelFile ? [excelFile] : []);
  show("noent", noEntFiles);
}

function showError(msg) {
  const el = document.getElementById("error-box");
  if (el) { el.textContent = msg; el.classList.remove("hidden"); }
}

function goManual() { step=4; renderStep(); }
function goBack() { step=1; renderStep(); }

async function processFiles() {
  if (!hojaFiles.length) return showError("Seleccioná al menos una hoja de ruta.");
  if (!excelFile) return showError("Seleccioná el Excel de gestión.");
  step=2; renderStep();
  try {
    setProcMsg("Leyendo hoja de ruta...");
    const todos = await extractNumbers(hojaFiles);
    let noEnt = new Set();
    if (noEntFiles.length) { setProcMsg("Leyendo no entregados..."); noEnt = new Set(await extractNumbers(noEntFiles)); }
    setProcMsg("Procesando Excel...");
    const exMap = await parseExcel(excelFile);
    setProcMsg("Calculando...");
    const fecha = document.getElementById("inp-fecha") ? document.getElementById("inp-fecha").value : todayStr();
    const entregados = todos.filter(n=>!noEnt.has(n));
    const cats={}; const sinMatch=[];
    entregados.forEach(num=>{
      let cat=exMap[num];
      if(cat){cat=normCat(cat);cats[cat]=(cats[cat]||0)+1;}
      else if(num.startsWith("G")) cats["Tarjeta Financiera"]=(cats["Tarjeta Financiera"]||0)+1;
      else if(num.startsWith("E")) cats["Documento Andreani"]=(cats["Documento Andreani"]||0)+1;
      else sinMatch.push(num);
    });
    reviewData={fecha,todosCount:todos.length,noEntCount:noEnt.size,entCount:entregados.length,cats,sinMatch};
    step=3; renderStep();
  } catch(err) {
    step=1; renderStep();
    setTimeout(()=>showError("Error: "+err.message),100);
  }
}

function setProcMsg(msg) {
  const el = document.getElementById("proc-msg");
  if (el) el.textContent = msg;
}

function confirmSave() {
  if (!reviewData) return;
  data[reviewData.fecha] = {...reviewData.cats};
  saveData();
  closeModal();
  // Ir al mes del día guardado
  const dt = new Date(reviewData.fecha+"T00:00:00");
  document.getElementById("sel-mes").value = dt.getMonth();
  document.getElementById("sel-anio").value = dt.getFullYear();
  render();
}

function manualSave() {
  const fecha = document.getElementById("inp-fecha-m").value;
  const cats = {};
  Object.keys(PRECIOS).forEach(cat=>{
    const id = "m_"+cat.replace(/\s/g,"_");
    const el = document.getElementById(id);
    if (el && parseInt(el.value)>0) cats[cat]=parseInt(el.value);
  });
  data[fecha] = cats;
  saveData();
  closeModal();
  const dt = new Date(fecha+"T00:00:00");
  document.getElementById("sel-mes").value = dt.getMonth();
  document.getElementById("sel-anio").value = dt.getFullYear();
  render();
}

// FILE PROCESSING
function fileToBase64(file) {
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });
}
function fileToBuffer(file) {
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsArrayBuffer(file); });
}

async function extractNumbers(files) {
  const content=[];
  for(const file of files){
    const b64=await fileToBase64(file);
    content.push(file.type.startsWith("image/")
      ?{type:"image",source:{type:"base64",media_type:file.type,data:b64}}
      :{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}});
  }
  content.push({type:"text",text:"Extract all Andreani tracking numbers. They start with digits, G, E or U and are ~15-16 chars long. Return ONLY a valid JSON array of strings, no markdown."});
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content}]})
  });
  const d=await res.json();
  return JSON.parse(d.content[0].text.trim().replace(/```json|```/g,"").trim());
}

async function parseExcel(file) {
  const buf=await fileToBuffer(file);
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1});
  const header=rows[0].map(h=>String(h||"").toLowerCase());
  const eIdx=header.findIndex(h=>h==="envío"||h==="envio"||(h.includes("nv")&&!h.includes("tipo")));
  const sIdx=header.findIndex(h=>h.includes("tipo de servicio"));
  if(eIdx===-1||sIdx===-1) throw new Error("No encontré columnas Envío y Tipo de Servicio.");
  const map={};
  for(let i=1;i<rows.length;i++){
    const e=String(rows[i][eIdx]||"").trim();
    const sv=String(rows[i][sIdx]||"").trim();
    if(e&&sv) map[e]=sv;
  }
  return map;
}
